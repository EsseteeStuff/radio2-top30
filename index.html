<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 2 Top 30 Hits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Radio 2 Top 30 Hits</h1>
    </header>

    <main>
      <section class="form-section">
        <div class="form-group">
          <label for="workdir">WORKDIR</label>
          <div class="input-row">
            <input type="text" id="workdir" placeholder="Selecteer een werkmap..." readonly>
            <button id="btn-workdir" class="btn btn-secondary">Bladeren...</button>
          </div>
        </div>

        <div class="form-group">
          <label for="muziekfolder">Muziekfolder</label>
          <div class="input-row">
            <input type="text" id="muziekfolder" placeholder="Selecteer een muziekmap..." readonly>
            <button id="btn-muziekfolder" class="btn btn-secondary">Bladeren...</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="beginjaar">Beginjaar</label>
            <input type="number" id="beginjaar" value="1971" min="1970" max="2026">
          </div>
          <div class="form-group">
            <label for="eindjaar">Eindjaar</label>
            <input type="number" id="eindjaar" value="1975" min="1970" max="2026">
          </div>
        </div>
      </section>

      <section class="log-section">
        <label>Uitvoer</label>
        <div id="log-output" class="log-output"></div>
      </section>
    </main>

    <footer>
      <button id="btn-toggle" class="btn btn-primary btn-large">Start</button>
    </footer>
  </div>

  <script>
    const btnWorkdir = document.getElementById('btn-workdir');
    const btnMuziekfolder = document.getElementById('btn-muziekfolder');
    const btnToggle = document.getElementById('btn-toggle');
    const logOutput = document.getElementById('log-output');
    const inputWorkdir = document.getElementById('workdir');
    const inputMuziekfolder = document.getElementById('muziekfolder');
    const inputBeginjaar = document.getElementById('beginjaar');
    const inputEindjaar = document.getElementById('eindjaar');

    let isRunning = false;

    // Voeg logregel toe
    function addLogLine(text) {
      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = text;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    // Blader naar werkmap
    btnWorkdir.addEventListener('click', async () => {
      const dir = await window.api.selectWorkdir();
      if (dir) inputWorkdir.value = dir;
    });

    // Blader naar muziekmap
    btnMuziekfolder.addEventListener('click', async () => {
      const dir = await window.api.selectMuziekfolder();
      if (dir) inputMuziekfolder.value = dir;
    });

    // Start/Stop-knop
    btnToggle.addEventListener('click', async () => {
      if (!isRunning) {
        const workDir = inputWorkdir.value.trim();
        const muziekFolder = inputMuziekfolder.value.trim();
        const beginJaar = parseInt(inputBeginjaar.value, 10);
        const eindJaar = parseInt(inputEindjaar.value, 10);

        if (!workDir) { addLogLine('[Fout] Selecteer eerst een WORKDIR.'); return; }
        if (!muziekFolder) { addLogLine('[Fout] Selecteer eerst een Muziekfolder.'); return; }
        if (!beginJaar || !eindJaar || beginJaar > eindJaar) {
          addLogLine('[Fout] Ongeldige jaartallen.'); return;
        }
        if (beginJaar < 1970) {
          addLogLine('[Fout] Beginjaar kan niet vóór 1970 liggen.'); return;
        }

        isRunning = true;
        btnToggle.textContent = 'Stop';
        btnToggle.classList.add('btn-danger');
        btnToggle.classList.remove('btn-primary');
        logOutput.innerHTML = '';

        const result = await window.api.start({ workDir, muziekFolder, beginJaar, eindJaar });
        if (result.error) {
          addLogLine(`[Fout] ${result.error}`);
          resetButton();
        }
      } else {
        await window.api.stop();
      }
    });

    // Luister naar logberichten van main-proces
    window.api.onLog((msg) => {
      addLogLine(msg);
    });

    // Luister naar beeindiging
    window.api.onFinished(() => {
      addLogLine('[Info] Pipeline is voltooid.');
      resetButton();
    });

    function resetButton() {
      isRunning = false;
      btnToggle.textContent = 'Start';
      btnToggle.classList.remove('btn-danger');
      btnToggle.classList.add('btn-primary');
    }

    // Controleer bij laden of programma actief is
    window.api.isRunning().then(running => {
      if (running) {
        isRunning = true;
        btnToggle.textContent = 'Stop';
        btnToggle.classList.add('btn-danger');
        btnToggle.classList.remove('btn-primary');
      }
    });
  </script>
</body>
</html>
